name: Code Coverage Workflow

# Run the coverage pipeline on pull requests to main (so Codecov can post the PR
# coverage comment), on pushes to main (so Codecov records the main-branch baseline
# those PR comments are compared against, and the README badge stays current), and
# manually on demand. The job fails when total coverage drops below 90%.
on:
  pull_request:
    branches: [ main ]

  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  coverage:
    name: Code Coverage CI Check
    runs-on: ubuntu-latest

    steps:
    # Checkout repo
    - name: Checkout repo
      uses: actions/checkout@v4

    # Set up Python environment
    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.11.9"

    # Install the package (including the GUI subpackage) and its development dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,gui]"

    # Run the tests under coverage. --cov-fail-under=90 is the gate: the step exits
    # non-zero (failing the PR check) if total coverage is below 90%, matching the
    # gate both consuming apps hold. The XML report feeds the Codecov upload below.
    - name: Run tests with coverage
      run: |
        pytest --cov=fishbowl_common --cov-report=xml --cov-report=term --cov-fail-under=90

    # Publish the coverage report to Codecov (drives the coverage percentage badge).
    # Requires a CODECOV_TOKEN repo secret. always() so the report still uploads when
    # the gate above fails -- that is exactly when the PR coverage comment is most
    # useful. The upload itself soft-fails so a Codecov outage never masks the gate.
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
