[build-system]
# setuptools>=77 for PEP 639: the SPDX license expression and license-files below are
# rejected by older versions.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fishbowl-common"
# The version is not written here. It lives in fishbowl_common/_version.py, which this
# reads via [tool.setuptools.dynamic] below, so the packaged version and the attribute an
# application reports can never disagree. See that module for why it is the source.
dynamic = ["version"]
description = "Shared infrastructure and GUI classes for the Fishbowl desktop tools (update check and install, CLI args, settings persistence, themed tkinter windows)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Avery Hammond", email = "149446626+averylhammond@users.noreply.github.com" },
]
# No "License :: OSI Approved" classifier: PEP 639 deprecates license classifiers, and
# setuptools rejects one used alongside the SPDX expression above.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# No runtime dependencies: every class relies only on the Python standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/averylhammond/fishbowl-common"
Repository = "https://github.com/averylhammond/fishbowl-common"
Changelog = "https://github.com/averylhammond/fishbowl-common/blob/main/CHANGELOG.md"
Issues = "https://github.com/averylhammond/fishbowl-common/issues"

[project.optional-dependencies]
# The GUI subpackage needs only tkinter, which ships with CPython, so this extra
# adds no requirements. It exists to mark intent: fishbowl_common itself must stay
# importable with no tkinter present, so a consumer that runs headless installs the
# package without it.
gui = []
dev = [
    "pytest==8.4.1",
    "pytest-cov==7.0.0",
    # The linter and formatter. Pinned to the version FishbowlInvoiceTool pins in its
    # requirements/dev.txt: a ruff release can add rules or change the formatter's output,
    # so an unpinned version would fail CI on a commit that was clean the day before.
    "ruff==0.16.5",
]

[tool.setuptools]
packages = ["fishbowl_common", "fishbowl_common.gui"]

[tool.setuptools.dynamic]
version = { attr = "fishbowl_common._version.__version__" }

[tool.setuptools.package-data]
# The PEP 561 marker, which is what publishes the annotations both halves already carry
# to a type checker running in a consuming application. One marker at the top-level
# package root covers fishbowl_common.gui too.
fishbowl_common = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# color_theme and font_settings are inert styling data with no behavior to test,
# so measuring them would only dilute the percentage.
omit = [
    "fishbowl_common/gui/color_theme.py",
    "fishbowl_common/gui/font_settings.py",
]

[tool.ruff]
line-length = 120
# Redundant with requires-python above, which ruff would infer the same target from. It is
# stated anyway so this block stays diffable against the copies in FishbowlInvoiceTool and
# FishbowlInventoryTool, where there is no [project] table to infer from.
target-version = "py311"
# No extend-exclude: everything ruff should not read (venv/, build/, dist/, *.egg-info/) is
# already in .gitignore, which ruff honors. Unlike the two apps, this repo has neither an
# untracked sibling clone nor a private submodule in the tree.

[tool.ruff.format]
# skip-magic-trailing-comma is deliberately left at its default of false. A trailing comma
# is an authoring signal that a construct stays exploded, and honoring it keeps "add one
# import" a one-line diff rather than a whole-line rewrite.

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "BLE", # flake8-blind-except
    "ANN", # flake8-annotations
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "TRY", # tryceratops
    "PL",  # pylint
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    # Documented by ruff as conflicting with its own formatter.
    "W191",
    "E111",
    "E114",
    "E117",
]
# FishbowlInvoiceTool's block also ignores PLR0915 for its main display's build_widgets().
# Deliberately not copied: no function here is over the 50-statement default, and a config
# ignore with no site is invisible -- RUF100 reports an unused inline noqa, nothing reports
# an unused entry in this list.

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # Test parameters are deliberately unannotated -- the docstring's Args: entry carries
    # the type instead. See .claude/rules/tests.md.
    "ANN",
    # An assertion's expected value is meant to be a literal spelled out at the assertion.
    # Hoisting `assert len(widgets) == 18` to a named constant hides the number the test
    # exists to pin.
    "PLR2004",
]

[tool.ruff.lint.isort]
# This is the package, so it is the first-party name. The two apps' copies of this block
# invert that: there source is first party and fishbowl_common is third party, installed
# from a pinned git tag.
known-first-party = ["fishbowl_common"]

[tool.ruff.lint.pylint]
# CLAUDE.md requires every app-specific value arrive by constructor injection rather than
# from a module-level default, which puts UpdateWindow.__init__ at 10 parameters by design.
max-args = 10
